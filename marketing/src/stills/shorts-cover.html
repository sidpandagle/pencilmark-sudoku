<!doctype html>
<html><head><meta charset="utf-8"><title>Shorts cover</title>
<style>
  .t{position:absolute;left:72px;right:140px;top:250px;font-size:132px;font-weight:900;letter-spacing:-0.035em;line-height:0.98}
  .s{position:absolute;left:72px;right:140px;top:420px;font-size:52px;font-weight:700}
  .brand{position:absolute;left:0;right:0;top:1440px;display:flex;justify-content:center;align-items:center;gap:20px;font-size:44px;font-weight:900}
</style></head>
<body>
<script type="module">
// Shorts / Reels / TikTok cover, 1080x1920. ?tech=hidden-single|naked-pair|x-wing&title=&sub=
// Text stays inside the 9:16 safe area (x 72-940, y 220-1500).
import { stage, baseCSS, div, TOKENS, Board, heroBoard, loadJSON, markSVG, stillReady, params } from '../lib/pm.js';
stage();
baseCSS('light');
const k = TOKENS.light;
const X = (await loadJSON('../../data/explainers.json'))[params.get('tech') || 'x-wing'];
div('paperGrid').style.opacity = 0.4;
div('t', document.body, params.get('title') || X.name);
div('s', document.body, `<span style="color:${k.hint}">${params.get('sub') || 'One technique. One real puzzle.'}</span>`);
const B = new Board(document.body, { x: 135, y: 560, size: 810 });
heroBoard(B, X);
const brand = div('brand', document.body, 'Pencilmark');
brand.prepend(markSVG(72));
await stillReady();
</script>
</body></html>
