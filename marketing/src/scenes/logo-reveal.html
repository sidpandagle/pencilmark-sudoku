<!doctype html>
<html><head><meta charset="utf-8"><title>Logo reveal</title></head>
<body>
<script type="module">
// Logo reveal (~4 s). Square: stacked lockup. Landscape: horizontal lockup.
// Beats: tile pops -> grid frame and lines draw -> candidate dots -> pencil -> wordmark -> i-dot drops -> tagline.
import { stage, baseCSS, register, markSVG, wordmark, div, css, seg, ease, TOKENS, TAGLINE } from '../lib/pm.js';
const { W, H, portrait, square } = stage();
baseCSS('light');
const k = TOKENS.light;
const unit = Math.min(W, H);
const grid = div('paperGrid');
const wrap = div('abs');
const horizontal = W > H * 1.3;
wrap.style.cssText = `position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:${horizontal ? 'row' : 'column'};gap:${unit * (horizontal ? 0.06 : 0.05)}px`;
const markBox = div('', wrap);
const mark = markSVG(unit * (horizontal ? 0.34 : 0.36));
markBox.appendChild(mark);
const text = div('', wrap);
text.style.cssText = `display:flex;flex-direction:column;align-items:${horizontal ? 'flex-start' : 'center'}`;
const wmClip = div('', text);
wmClip.style.cssText = `overflow:hidden;padding:0 ${unit * 0.05}px 0 ${unit * 0.01}px`;
const wm = wordmark(wmClip, { size: unit * (horizontal ? 0.15 : 0.13) });
const tag = div('', text, TAGLINE);
tag.style.cssText = `font-size:${unit * 0.052}px;font-weight:600;color:${k.inkMuted};margin-top:${-unit * 0.01}px;padding-left:${horizontal ? unit * 0.012 : 0}px`;

register(4.0, (t) => {
  css(grid, { opacity: 0.5 * ease.out(seg(t, 0, 0.6)) });
  mark.pose({ tile: seg(t, 0.0, 0.55), frame: seg(t, 0.25, 1.05), lines: seg(t, 0.55, 1.45), dots: seg(t, 1.25, 1.85), pencil: seg(t, 1.5, 2.05) });
  const w = ease.out(seg(t, 1.8, 2.5));
  css(wm, { transform: `translateY(${(1 - w) * 110}%)`, opacity: Math.min(1, w * 2) });
  const d = seg(t, 2.35, 2.75);
  css(wm.dot, { opacity: Math.min(1, d * 4), transform: `translateY(${(1 - ease.back(d)) * -1.2}em) rotate(${(1 - d) * 90}deg)` });
  const g = ease.out(seg(t, 2.7, 3.25));
  css(tag, { opacity: g, transform: `translateY(${(1 - g) * 20}px)` });
});
</script>
</body></html>
