<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Adaptive icon background: ink-blue diagonal gradient, full bleed, opaque. Same size as foreground. -->
  <defs>
    <linearGradient id="inkBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D5193"/>
      <stop offset="1" stop-color="#1B2B47"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#inkBlue)"/>
</svg>
