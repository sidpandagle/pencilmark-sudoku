<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <!--
    Wordmark "Pencilmark": heavy system font, the "i" is a dotless i (U+0131) and its dot is a small
    pencil-mark square in the accent colour (#idot).
    scripts/export-assets.mjs measures the dotless i in the installed font and moves #idot over it,
    then trims the canvas. Edit colours/size here; the dot position is recomputed on export.
    Dark variant is produced by the export script (ink -> #E8ECF1, accent -> #8DB2FF).
  -->
  <text id="wordtext" x="40" y="200" fill="#1E2733"
        font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="180"
        letter-spacing="-4">Penc<tspan id="dotless">&#x131;</tspan>lmark</text>
  <rect id="idot" x="400" y="38" width="36" height="36" rx="5" fill="#2F5DA8"/>
</svg>
